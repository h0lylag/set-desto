name: Build

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  cargo:
    name: Cargo (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            artifact_os: linux
            binary_path: target/release/set-desto
            binary_name: set-desto
          - platform: windows-latest
            artifact_os: windows
            binary_path: target/release/set-desto.exe
            binary_name: set-desto.exe

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ runner.os != 'Windows' }}

      - name: check formatting
        run: cargo fmt --check

      - name: run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: run tests
        run: cargo test

      - name: build release
        run: cargo build --release

      - name: read package version
        id: package
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version = "([^"]+)"') {
            throw "Could not find package version in Cargo.toml"
          }
          "version=v$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: stage release artifact
        shell: pwsh
        run: |
          $artifactDir = "dist/set-desto-${{ matrix.artifact_os }}-${{ steps.package.outputs.version }}"
          New-Item -ItemType Directory -Force $artifactDir | Out-Null
          Copy-Item "${{ matrix.binary_path }}" "$artifactDir/${{ matrix.binary_name }}"
          Copy-Item README.md "$artifactDir/README.md"
          Copy-Item LICENSE "$artifactDir/LICENSE"

      - name: upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: set-desto-${{ matrix.artifact_os }}-${{ steps.package.outputs.version }}
          path: dist/set-desto-${{ matrix.artifact_os }}-${{ steps.package.outputs.version }}/*
          if-no-files-found: error
