[package]
name = "set-desto"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Desktop utility for setting EVE Online autopilot destinations across authenticated characters."
license = "MIT"
readme = "README.md"
keywords = ["eve-online", "esi", "egui", "desktop"]
categories = ["gui"]

[profile.release]
lto = true
strip = true
codegen-units = 1

[dependencies]
anyhow = "1.0.100"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
directories = "6"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5"
webbrowser = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33.2", default-features = false, features = ["default_fonts", "glow", "x11"] }
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.33.2", default-features = false, features = ["default_fonts", "glow"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
