[package]
name = "set-desto"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
strip = true
codegen-units = 1

[dependencies]
anyhow = "1.0.100"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
directories = "6"
keyring = { version = "3", features = ["sync-secret-service", "windows-native"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5"
webbrowser = "1.0"

eframe = { version = "0.33.2", default-features = false, features = ["glow", "x11"] }
egui = "0.33.2"
